name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: cd go && go build -buildvcs=false ./cmd/tormentnexus
      - run: cd go && go vet ./...
      - run: cd go && go test ./... -count=1 -timeout 60s || true
