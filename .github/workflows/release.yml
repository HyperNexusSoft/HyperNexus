name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          go build -buildvcs=false -ldflags="-s -w" \
            -o ../tormentnexus-${{ matrix.suffix }} \
            ./cmd/tormentnexus
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tormentnexus-${{ matrix.suffix }}
          path: tormentnexus-${{ matrix.suffix }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create release archives
        run: |
          mkdir -p release
          # Windows
          cd artifacts/tormentnexus-windows-amd64.exe
          zip ../../release/tormentnexus-windows-amd64.zip \
            tormentnexus-windows-amd64.exe
          cd ../..
          # macOS amd64
          cd artifacts/tormentnexus-darwin-amd64
          tar czf ../../release/tormentnexus-darwin-amd64.tar.gz \
            tormentnexus-darwin-amd64
          cd ../..
          # macOS arm64
          cd artifacts/tormentnexus-darwin-arm64
          tar czf ../../release/tormentnexus-darwin-arm64.tar.gz \
            tormentnexus-darwin-arm64
          cd ../..
          # Linux amd64
          cd artifacts/tormentnexus-linux-amd64
          tar czf ../../release/tormentnexus-linux-amd64.tar.gz \
            tormentnexus-linux-amd64
          cd ../..
          # Linux arm64
          cd artifacts/tormentnexus-linux-arm64
          tar czf ../../release/tormentnexus-linux-arm64.tar.gz \
            tormentnexus-linux-arm64
          cd ../..
      - name: List release files
        run: ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
