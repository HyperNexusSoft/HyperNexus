name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -buildvcs=false -ldflags="-s -w" \
            -o ../tormentnexus-${{ matrix.suffix }}${EXT} \
            ./cmd/tormentnexus
      - name: Create archive
        run: |
          mkdir -p release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "release/tormentnexus-${{ matrix.suffix }}.zip" \
              tormentnexus-${{ matrix.suffix }}.exe
          else
            tar czf "release/tormentnexus-${{ matrix.suffix }}.tar.gz" \
              tormentnexus-${{ matrix.suffix }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: release/*

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          cp release-artifacts/**/tormentnexus-* release/ 2>/dev/null || true
          cp installers/windows/install-gui.ps1 release/ 2>/dev/null || true
          cp installers/windows/install.bat release/ 2>/dev/null || true
          cp installers/macos/install-terminal.sh release/ 2>/dev/null || true
          cp installers/linux/install.sh release/ 2>/dev/null || true
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
