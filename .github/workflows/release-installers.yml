name: Build & Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          go build -buildvcs=false -ldflags="-s -w" \
            -o ../tormentnexus-${{ matrix.suffix }} \
            ./cmd/tormentnexus
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tormentnexus-${{ matrix.suffix }}
          path: tormentnexus-${{ matrix.suffix }}

  build-npm:
    name: Build NPM Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            packages/*/dist
            packages/*/build

  create-installers:
    name: Create Installers
    needs: [build-go, build-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Windows installer
        run: |
          mkdir -p installers/windows
          cp artifacts/tormentnexus-windows-amd64.exe \
            installers/windows/tormentnexus.exe
          cat > installers/windows/install.bat << 'BATCH'
          @echo off
          echo Installing TormentNexus...
          mkdir "%USERPROFILE%\.tormentnexus" 2>nul
          copy tormentnexus.exe "%USERPROFILE%\.tormentnexus\"
          echo Installation complete!
          echo Run: %USERPROFILE%\.tormentnexus\tormentnexus.exe serve
          pause
          BATCH
          cd installers/windows
          zip -r ../../tormentnexus-windows-installer.zip .
      - name: Create macOS installer
        run: |
          mkdir -p installers/macos
          cp artifacts/tormentnexus-darwin-amd64 \
            installers/macos/tormentnexus
          cp artifacts/tormentnexus-darwin-arm64 \
            installers/macos/tormentnexus-arm64
          chmod +x installers/macos/*
          cat > installers/macos/install.sh << 'SHELL'
          #!/bin/bash
          echo "Installing TormentNexus..."
          mkdir -p ~/.tormentnexus
          if [[ $(uname -m) == "arm64" ]]; then
            cp tormentnexus-arm64 ~/.tormentnexus/tormentnexus
          else
            cp tormentnexus ~/.tormentnexus/tormentnexus
          fi
          chmod +x ~/.tormentnexus/tormentnexus
          echo "Installation complete!"
          echo "Run: ~/.tormentnexus/tormentnexus serve"
          SHELL
          chmod +x installers/macos/install.sh
          cd installers/macos
          zip -r ../../tormentnexus-macos-installer.zip .
      - name: Create Linux installer
        run: |
          mkdir -p installers/linux
          cp artifacts/tormentnexus-linux-amd64 \
            installers/linux/tormentnexus
          cp artifacts/tormentnexus-linux-arm64 \
            installers/linux/tormentnexus-arm64
          chmod +x installers/linux/*
          cat > installers/linux/install.sh << 'SHELL'
          #!/bin/bash
          echo "Installing TormentNexus..."
          mkdir -p ~/.tormentnexus
          if [[ $(uname -m) == "aarch64" ]]; then
            cp tormentnexus-arm64 ~/.tormentnexus/tormentnexus
          else
            cp tormentnexus ~/.tormentnexus/tormentnexus
          fi
          chmod +x ~/.tormentnexus/tormentnexus
          echo "Installation complete!"
          echo "Run: ~/.tormentnexus/tormentnexus serve"
          SHELL
          chmod +x installers/linux/install.sh
          cd installers/linux
          zip -r ../../tormentnexus-linux-installer.zip .
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: tormentnexus-*-installer.zip

  release:
    name: Create GitHub Release
    needs: [create-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            installers/tormentnexus-windows-installer.zip
            installers/tormentnexus-macos-installer.zip
            installers/tormentnexus-linux-installer.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
