version: '3.8'

services:
  # Isolated web dashboard portal per account group
  web-isolated:
    image: tormentnexus-web:latest
    build:
      context: .
      target: web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://sidecar-isolated:7778
    ports:
      # Port mapped dynamically per tenant by the cloud orchestrator
      - "${TENANT_PORT:-3001}:3000"
    networks:
      - tenant-network
    restart: on-failure:5

networks:
  tenant-network:
    internal: false
